<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="One color-sort puzzle a day, same for everyone.">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Daily Sort">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Daily Sort: one color puzzle a day</title>
  <meta name="theme-color" content="#FFF7EA">
  <meta property="og:title" content="Daily Sort">
  <meta property="og:description" content="One color-sort puzzle a day, same for everyone. Can you hit par?">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <style>
    html, body { margin: 0; background: #FFF7EA; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 800 20px/1 system-ui, sans-serif; color: #8A8070; letter-spacing: .5px; }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="splash">Daily Sort</div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Draw at most 2 pixels per CSS pixel. On 3x phone screens this looks the
    // same but more than halves the work of every frame, which is what keeps
    // pours smooth in the browser.
    (function () {
      var d = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio') ||
        Object.getOwnPropertyDescriptor(Window.prototype, 'devicePixelRatio');
      if (!d || !d.get) return;
      try {
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: function () { return Math.min(2, d.get.call(window) || 1); },
        });
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
